{{/*
The KubeVirt custom resource. Only fields from .Values.kubevirt.spec render,
so Helm does not own fields that the values leave out.
*/}}
{{- $spec := deepCopy (.Values.kubevirt.spec | default dict) }}
{{- /*
KubeVirt hashes spec.uninstallStrategy into its install strategy, so a change of
the field rolls all KubeVirt components. When the chart adopts a running KubeVirt
that has no uninstallStrategy, the chart leaves the field out until the version
changes. The upgrade rolls the components anyway, and sets the field at that time.
*/}}
{{- if hasKey $spec "uninstallStrategy" }}
{{- $live := lookup "kubevirt.io/v1" "KubeVirt" .Release.Namespace "kubevirt" }}
{{- if $live }}
{{- $liveStrategy := dig "spec" "uninstallStrategy" "" $live }}
{{- $observed := dig "status" "observedKubeVirtVersion" "" $live }}
{{- if and (not $liveStrategy) (eq $observed .Values.image.tag) }}
{{- $_ := unset $spec "uninstallStrategy" }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
The operator uses spec.imageTag for every component except itself. If the live CR
has spec.imageTag (for example from an earlier kubectl patch), and the values do not
set imageTag, the chart sets it to .Values.image.tag, so that a chart upgrade moves
all components. If the live CR has no spec.imageTag, the field does not render.
helm template has no cluster access, so it never renders the field.
*/}}
{{- if not (hasKey $spec "imageTag") }}
{{- $liveCR := lookup "kubevirt.io/v1" "KubeVirt" .Release.Namespace "kubevirt" }}
{{- if and $liveCR (dig "spec" "imageTag" "" $liveCR) }}
{{- $_ := set $spec "imageTag" .Values.image.tag }}
{{- end }}
{{- end }}
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.kubevirt.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.kubevirt.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $spec }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
