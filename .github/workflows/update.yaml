name: Update charts

# Daily: find new stable upstream releases that have no chart yet, generate the
# chart, and open one pull request per release. This workflow never publishes.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  find:
    name: Find new upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      missing: ${{ steps.missing.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - id: missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          missing=$(go run ./cmd/chartgen missing)
          echo "missing=$missing" >>"$GITHUB_OUTPUT"
          echo "Releases without a chart: $missing"

  pr:
    name: Chart for ${{ matrix.project }} ${{ matrix.tag }}
    needs: find
    if: needs.find.outputs.missing != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # to start ci.yaml on the pull request branch
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.find.outputs.missing) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Generate
        env:
          PROJECT: ${{ matrix.project }}
          TAG: ${{ matrix.tag }}
        run: go run ./cmd/chartgen generate --project "$PROJECT" --tag "$TAG"
      - id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: chartgen/${{ matrix.project }}-${{ matrix.tag }}
          delete-branch: true
          add-paths: charts/${{ matrix.project }}
          commit-message: "${{ matrix.project }}: add chart for upstream ${{ matrix.tag }}"
          title: "${{ matrix.project }}: add chart for upstream ${{ matrix.tag }}"
          body: |
            Generated by `go run ./cmd/chartgen generate --project ${{ matrix.project }} --tag ${{ matrix.tag }}`.

            Upstream release: https://github.com/${{ matrix.project == 'cdi' && 'kubevirt/containerized-data-importer' || 'kubevirt/kubevirt' }}/releases/tag/${{ matrix.tag }}

            CI renders the chart, compares it with the upstream manifest, and runs the
            adoption and upgrade test from the previous release to this one.
            After merge, the publish workflow pushes and signs the chart.
          labels: chartgen
      # A pull request that GITHUB_TOKEN opens or updates does not start ci.yaml.
      # A workflow_dispatch from GITHUB_TOKEN does, so start CI on the branch here.
      - name: Start CI on the pull request branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chartgen/${{ matrix.project }}-${{ matrix.tag }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Started CI on $BRANCH for $PR_URL"
