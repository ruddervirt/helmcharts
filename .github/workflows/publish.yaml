name: Publish

# On every push to main: run all tests, then push every chart version that the
# registry does not have yet and sign it. Published versions are never overwritten.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    name: Push and sign
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing with the GitHub OIDC token
    env:
      REGISTRY: ghcr.io/ruddervirt/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push and sign new chart versions
        run: hack/publish.sh
